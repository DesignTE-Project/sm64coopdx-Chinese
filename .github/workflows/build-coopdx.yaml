name: 构建特殊平台的 sm64coopdx（不含 DiscordLib）

on:
  workflow_dispatch: # 允许网页端手动点击触发
    inputs:
      arm64:
        description: "构建 ARM64 Linux"
        type: boolean
        default: true
      riscv:
        description: "构建 RISC-V Linux"
        type: boolean
        default: true
      riscv-gles2:
        description: "[RISC-V] 是否使用 GLES2 视频后端（建议默认）"
        type: boolean
        default: true
      freebsd:
        description: "构建 FreeBSD"
        type: boolean
        default: true
      # BETTERCAMERA
      bettercam:
        description: "[全局] 启用 Better Camera"
        type: boolean
        default: true
      # COOPNET_SDK
      coopnet:
        description: "[全局] 启用 Coopnet SDK (关闭则不能连 Coopnet)"
        type: boolean
        default: true
      # HEADLESS
      headless:
        description: "[全局] 无头模式（没有图形界面，适合编译 Coopnet 上的无人服务器）"
        type: boolean
        default: false
      # EXT_OPTIONS_MENU
      extmenu:
        description: "[全局] 显示隐藏的扩展菜单"
        type: boolean
        default: false

jobs:
  build-arm64-linux:
    runs-on: ubuntu-24.04-arm
    if: ${{ inputs.arm64 == true }}
    name: arm64 Linux（树莓派/Termux）
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ====================================================================
      # 【如果你用的是公开仓库 + Secret 方案，请删掉下面三行最前面的 # 号以解除注释】
      # - name: Decode Baserom from Secrets
      #   run: |
      #     echo "${{ secrets.BASE64_ROM }}" | base64 -d > baserom.us.z64
      # ====================================================================

      - name: Install Native Dependencies
        run: |
          sudo apt-get update
          # 因为本身就是 arm64 系统，直接装就是原生 arm64 开发库，省心到极点
          sudo apt-get install -y build-essential git python3 libsdl2-dev libglew-dev libcurl4-openssl-dev zlib1g-dev bsdmainutils libx11-dev

      - name: Compile Game Natively
        run: |
          # 没有任何交叉编译参数，核心全开 (-j$(nproc))，起飞！
          make DISCORDRPC=0 -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64coopdx_arm64_linux
          path: build/us_pc/

  build-riscv:
    runs-on: ubuntu-latest
    if: ${{ inputs.riscv == true }}
    name: RISC-V Linux 构建
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: build in docker
        run: |
          cat << 'EOF' > build_riscv.sh
          #!/bin/bash
          set -e
          echo "depending..."
          apt-get update
          apt-get install -y build-essential libsdl2-dev libglew-dev python3 git pkg-config
          echo "开始编译 RISCV 虽然但是不知道 RISCV 有多搞？！！"
          make RENDER_API=gles2 DISCORD_SDK=0 EXTERNAL_DATA=1 -j$(nproc)
          EOF
          chmod +x build_riscv.sh

          docker run --rm \
            --platform linux/riscv64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:24.04 \
            ./build_riscv.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64coopdx_riscv64_linux
          path: build/us_pc/

  build-freebsd:
    runs-on: ubuntu-22.04
    if: ${{ inputs.freebsd == true }}
    name: FreeBSD 构建

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: freebsd vm/build
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync # 同步文件
          prepare: |
            pkg update
            pkg install -y gmake sdl2 glew python3 git pkgconf gcc x11/libXrandr x11/libXinerama x11/libXi x11/libX11 x11/xorgproto
            ln -sf /usr/local/bin/python3 /usr/local/bin/python
            ln -sf /usr/local/bin/g++14 /usr/local/bin/g++
          run: |
            # 使用特殊的 sys/stat.h 看看能不能解决问题
            echo '#include <sys/stat.h>' > tmp.c
            cat src/pc/mumble/mumble.c >> tmp.c
            mv tmp.c src/pc/mumble/mumble.c
            
            echo "开始编译。请坐和放宽"
            gmake EXTERNAL_DATA=1 DISCORD_SDK=0 -j$(sysctl -n hw.ncpu)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sm64coopdx_freebsd
          path: build/us_pc/
