name: 构建 sm64coopdx arm64（无discordLib）

on:
  workflow_dispatch: # 允许网页端手动点击触发

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # - name: Decode Baserom from Secrets
      #   run: |
      #     echo "${{ secrets.BASE64_ROM }}" | base64 -d > baserom.us.z64
      
      - name: Setup Multiarch and Install Toolchain
        run: |
          # 获取当前 Ubuntu 系统的代号 (例如 jammy 或 noble)
          SUITE=$(lsb_release -sc)
          
          # 1. 启用 arm64 架构
          sudo dpkg --add-architecture arm64
          
          # 2. 修复原有源：限制它们只服务 amd64，并追加 arm64 的 ports 官方源
          
          # 【情况 A】自适应处理 Ubuntu 24.04+ 新版 DEB822 源格式 (.sources)
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            if ! grep -q "Architectures:" /etc/apt/sources.list.d/ubuntu.sources; then
              # 给现有的所有源块注入架构限制，防止它们去请求 arm64
              sudo sed -i '/^Types: deb/i Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
            fi
            
            # 创建 arm64 专属的 ports 源文件
            sudo tee /etc/apt/sources.list.d/arm64.sources << EOF
Types: deb
URIs: http://ports.ubuntu.com/ubuntu-ports/
Suites: ${SUITE} ${SUITE}-updates ${SUITE}-backports ${SUITE}-security
Components: main restricted universe multiverse
Architectures: arm64
Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
EOF
          fi
          
          # 【情况 B】自适应处理 Ubuntu 22.04 及以前的老版单行源格式 (sources.list)
          if [ -f /etc/apt/sources.list ] && [ -s /etc/apt/sources.list ]; then
            if ! grep -q "\[arch=" /etc/apt/sources.list; then
              # 把原本的 "deb http..." 改写为 "deb [arch=amd64] http..."
              sudo sed -i 's/^deb /deb [arch=amd64] /g' /etc/apt/sources.list
            fi
            
            # 在末尾追加 arm64 专属的 ports 源
            sudo tee -a /etc/apt/sources.list << EOF
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${SUITE} main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${SUITE}-updates main restricted universe multiverse
deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${SUITE}-security main restricted universe multiverse
EOF
          fi
          
          # 3. 这时候再 update，两条通道各走各的，绝不会再报 404
          sudo apt-get update
          
          # 4. 安装交叉编译器与 arm64 的跨架构动态库
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt-get install -y build-essential python3 bsdmainutils pkg-config
          sudo apt-get install -y libsdl2-dev:arm64 libglew-dev:arm64 libcurl4-openssl-dev:arm64 zlib1g-dev:arm64 libx11-dev:arm64
          
      - name: Compile Host Tools Natively
        run: |
          make -C tools
  
      - name: Cross-Compile Game to ARM64
        run: |
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          make CROSS_COMPILE=aarch64-linux-gnu- DISCORDRPC=0 -j$(nproc)

      - name: artifact out
        uses: actions/upload-artifact@v4
        with:
          name: sm64coopdx-arm64-linux-cross
          path: build/us_pc/
